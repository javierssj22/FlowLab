name: FlowLab validation
on: [push, pull_request]
jobs:
  software:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Linux'
        run: |
          for script in start.sh instalar-linux.sh start-webserial.sh scripts/build-linux.sh; do sh -n "$script"; done
          sh instalar-linux.sh
          .venv-linux/bin/python scripts/smoke-distribution.py .venv-linux/bin/python server.py
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [esp32, esp32s2, esp32s3, esp32c3, esp32c6]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@3.3.5 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli compile --fqbn esp32:esp32:${{ matrix.board }} firmware/FlowLabBridge
      - run: arduino-cli compile --fqbn esp32:esp32:${{ matrix.board }} examples/FlowLabStandalone
